<!DOCTYPE html>
<html>
<head>
    <title>Regrester </title>
    <link rel="icon" type="image/x-icon" href="image2/logo2.png">
    <style>
   
    
    body{
        background-image: url(hdimage/imghd1.jpg);
     

    }
   #sigin-box{
  
    background-color:rgba(0,0,0,0.1);/* transprant background*/
    width:350px;
    padding:30px;
    border-radius: 20px;
    box-shadow: 0,0,20px rgba(0,0,0.4);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(0.3s);
    text-align: center;
    margin:auto;
    margin-top: 10%;
   
 
}
#sigin-box input{
    width: 100%;
    padding : 10px;
    background-color: rgba(255,255,255,0.15);
    border:1px solid rgba(255,255,255,0.4);
    color:white;
    outline: none;
    border-radius: 5px;
}
button{
    width: 250px;
    padding: 20px;
    background-color: rgb(4, 77, 119);
    border: none;
    border-radius: 5px;
    cursor: pointer;
    margin: 10px;
}
button:hover {
    
      background-color: rgb(9, 65, 168);
}


h1{
    color:rgba(43, 122, 241, 0.959);
    font-family: Arial, Helvetica, sans-serif;
   
}
.input-group{
    margin: 15px;
    background-color: transparent !important; /* Make a comment important*/
}


    label{
        color:gray;
        font-size: 18px;
        font-family: Arial, Helvetica, sans-serif;
    }
  .input{
       margin: 15px;
       background-color: transparent;
  }

    </style>
</head>
<body> <!-- register form -->
        <div id="sigin-box" class="signin-box">
            <form>
                <h1>sign in</h1>
                <div class="input-group">
                   <label> username</label>
                   <input type="text"  id="username">
                </div>
                <div class="input-group">
                    <label>DOB</label>
                    <input type="date" id="DOB">
                </div>
                <div class="input-group">
                    <label>gmail</label>
                    <input type="email" id="gmail">
               
                <button type="submit"> Sign in</button>
            </form>
        </div>
       
         <script src="script.js"></script>

</body>
</html>
